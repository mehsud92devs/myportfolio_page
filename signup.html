<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Abdul Majeed SEO Services</title>
  <meta name="description" content="Create your Abdul Majeed SEO Services account to track your SEO progress and access exclusive resources.">
  <meta name="robots" content="noindex">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">

  <style>
    .auth-page-inner {
      min-height: 100vh;
      background-color: var(--secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body>

<div class="auth-page-inner">
  <div class="auth-card" role="main">

    <!-- Logo -->
    <div class="auth-logo">
      <a href="index.html" aria-label="Abdul Majeed SEO - Home">
        <img src="images/logo.svg" alt="Abdul Majeed SEO Logo" width="180" height="45">
      </a>
    </div>

    <h1 class="auth-heading">Create Your Account</h1>
    <p class="auth-subtext">Sign up to track your SEO progress and access exclusive resources.</p>

    <!-- Error message -->
    <div class="auth-error" id="auth-error" role="alert" aria-live="polite"></div>

    <form id="signup-form" novalidate aria-label="Sign up form">

      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <input class="form-input" type="text" id="signup-name" name="name" placeholder="Your full name" required autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Email Address</label>
        <input class="form-input" type="email" id="signup-email" name="email" placeholder="you@example.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-password">Password</label>
        <div class="password-field">
          <input class="form-input" type="password" id="signup-password" name="password" placeholder="Create a password" required autocomplete="new-password" style="padding-right:3rem;">
          <button type="button" class="password-toggle" id="signup-pw-toggle" aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <p class="password-hint">Min 8 characters, 1 number, 1 uppercase letter</p>
        <div class="password-strength" aria-live="polite">
          <div class="strength-bar-track"><div class="strength-bar-fill" id="strength-fill"></div></div>
          <span class="strength-text" id="strength-text"></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-confirm">Confirm Password</label>
        <div class="password-field">
          <input class="form-input" type="password" id="signup-confirm" name="confirm" placeholder="Repeat your password" required autocomplete="new-password" style="padding-right:3rem;">
          <button type="button" class="password-toggle" id="signup-conf-toggle" aria-label="Toggle confirm password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-group">
        <div class="form-checkbox-group">
          <input class="form-checkbox" type="checkbox" id="agree-privacy" name="agree" required>
          <label class="form-checkbox-label" for="agree-privacy">
            I agree to the <a href="privacy-policy.html" target="_blank" rel="noopener">Privacy Policy</a>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:0.5rem;">Create Account</button>

    </form>

    <div class="auth-divider"><span>or</span></div>

    <button type="button" class="btn-google" id="google-signup-btn">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.5-1.45-.79-3-.79-4.59s.27-3.14.79-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
      </svg>
      Continue with Google
    </button>

    <p class="auth-footer-text">
      Already have an account? <a href="login.html">Log In</a>
    </p>

  </div>
</div>

<script src="js/main.js" defer></script>
<script type="module" src="js/auth.js"></script>
</body>
</html>
