<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Google Sans, Roboto, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="520" fill="#ffffff"/>

  <!-- Top bar -->
  <rect width="900" height="52" fill="#f8f9fa"/>
  <rect y="52" width="900" height="1" fill="#e0e0e0"/>

  <!-- Google logo text -->
  <text x="20" y="33" font-size="18" font-weight="500" fill="#5f6368">Google</text>
  <text x="78" y="33" font-size="18" font-weight="500" fill="#1a73e8">Search</text>
  <text x="150" y="33" font-size="18" font-weight="500" fill="#5f6368">Console</text>
  <rect x="220" y="18" width="1" height="18" fill="#dadce0"/>
  <text x="232" y="33" font-size="14" fill="#5f6368">Performance</text>

  <!-- Date range pill -->
  <rect x="700" y="14" width="180" height="26" rx="13" fill="#e8f0fe"/>
  <text x="745" y="31" font-size="12" fill="#1a73e8" font-weight="500">Last 6 months</text>
  <text x="712" y="31" font-size="12" fill="#1a73e8">&#x1F4C5;</text>

  <!-- METRIC CARDS ROW -->
  <!-- Total clicks card -->
  <rect x="20" y="72" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="20" y="72" width="190" height="3" rx="1.5" fill="#1a73e8"/>
  <text x="32" y="97" font-size="11" fill="#5f6368">Total clicks</text>
  <text x="32" y="124" font-size="26" font-weight="600" fill="#1a73e8">24,700</text>

  <!-- Total impressions card -->
  <rect x="222" y="72" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="222" y="72" width="190" height="3" rx="1.5" fill="#5e35b1"/>
  <text x="234" y="97" font-size="11" fill="#5f6368">Total impressions</text>
  <text x="234" y="124" font-size="26" font-weight="600" fill="#5e35b1">412,800</text>

  <!-- Average CTR card -->
  <rect x="424" y="72" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="424" y="72" width="190" height="3" rx="1.5" fill="#00897b"/>
  <text x="436" y="97" font-size="11" fill="#5f6368">Average CTR</text>
  <text x="436" y="124" font-size="26" font-weight="600" fill="#00897b">5.9%</text>

  <!-- Average position card -->
  <rect x="626" y="72" width="190" height="80" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>
  <rect x="626" y="72" width="190" height="3" rx="1.5" fill="#e65100"/>
  <text x="638" y="97" font-size="11" fill="#5f6368">Average position</text>
  <text x="638" y="124" font-size="26" font-weight="600" fill="#e65100">11.2</text>

  <!-- CHART AREA -->
  <rect x="20" y="166" width="860" height="230" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Chart grid lines -->
  <line x1="60" y1="180" x2="860" y2="180" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="60" y1="210" x2="860" y2="210" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="60" y1="240" x2="860" y2="240" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="60" y1="270" x2="860" y2="270" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="60" y1="300" x2="860" y2="300" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="60" y1="330" x2="860" y2="330" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="60" y1="360" x2="860" y2="360" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="60" y1="385" x2="860" y2="385" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Y-axis labels (clicks) -->
  <text x="52" y="183" font-size="10" fill="#80868b" text-anchor="end">5K</text>
  <text x="52" y="243" font-size="10" fill="#80868b" text-anchor="end">4K</text>
  <text x="52" y="303" font-size="10" fill="#80868b" text-anchor="end">3K</text>
  <text x="52" y="363" font-size="10" fill="#80868b" text-anchor="end">2K</text>

  <!-- X-axis date labels -->
  <text x="80"  y="398" font-size="10" fill="#80868b" text-anchor="middle">Jan 1</text>
  <text x="200" y="398" font-size="10" fill="#80868b" text-anchor="middle">Feb 1</text>
  <text x="320" y="398" font-size="10" fill="#80868b" text-anchor="middle">Mar 1</text>
  <text x="440" y="398" font-size="10" fill="#80868b" text-anchor="middle">Apr 1</text>
  <text x="560" y="398" font-size="10" fill="#80868b" text-anchor="middle">May 1</text>
  <text x="680" y="398" font-size="10" fill="#80868b" text-anchor="middle">Jun 1</text>
  <text x="820" y="398" font-size="10" fill="#80868b" text-anchor="middle">Jun 30</text>

  <!-- Clicks line area fill -->
  <defs>
    <linearGradient id="clicksGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a73e8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a73e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="impressGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5e35b1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#5e35b1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Impressions area (background, lighter) -->
  <path d="M65,340 L130,320 L200,295 L270,280 L340,255 L410,235 L480,215 L550,200 L620,185 L690,195 L760,183 L830,178 L860,175 L860,385 L65,385 Z"
        fill="url(#impressGrad)"/>
  <!-- Impressions line -->
  <polyline points="65,340 130,320 200,295 270,280 340,255 410,235 480,215 550,200 620,185 690,195 760,183 830,178 860,175"
            fill="none" stroke="#5e35b1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Clicks area fill -->
  <path d="M65,375 L130,368 L200,360 L270,348 L340,335 L410,318 L480,300 L550,278 L620,258 L690,268 L760,245 L830,228 L860,218 L860,385 L65,385 Z"
        fill="url(#clicksGrad)"/>
  <!-- Clicks line -->
  <polyline points="65,375 130,368 200,360 270,348 340,335 410,318 480,300 550,278 620,258 690,268 760,245 830,228 860,218"
            fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Tooltip callout at peak -->
  <rect x="590" y="196" width="120" height="56" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1" filter="url(#shadow)"/>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
  </defs>
  <text x="598" y="213" font-size="10" fill="#5f6368">Jun 14, 2024</text>
  <rect x="598" y="219" width="8" height="2" rx="1" fill="#1a73e8"/>
  <text x="610" y="222" font-size="10" fill="#1a73e8">Clicks: <tspan font-weight="600">1,248</tspan></text>
  <rect x="598" y="230" width="8" height="2" rx="1" fill="#5e35b1"/>
  <text x="610" y="234" font-size="10" fill="#5e35b1">Impressions: <tspan font-weight="600">18,940</tspan></text>
  <circle cx="620" cy="258" r="4" fill="#1a73e8" stroke="#fff" stroke-width="2"/>
  <line x1="620" y1="218" x2="620" y2="253" stroke="#dadce0" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Legend -->
  <rect x="60" y="175" width="10" height="2" rx="1" fill="#1a73e8"/>
  <text x="74" y="180" font-size="11" fill="#3c4043">Clicks</text>
  <rect x="116" y="175" width="10" height="2" rx="1" fill="#5e35b1"/>
  <text x="130" y="180" font-size="11" fill="#3c4043">Impressions</text>

  <!-- QUERY TABLE -->
  <rect x="20" y="408" width="860" height="100" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Table header -->
  <rect x="20" y="408" width="860" height="30" rx="8" fill="#f8f9fa"/>
  <rect x="20" y="428" width="860" height="10" fill="#f8f9fa"/>
  <rect x="20" y="437" width="860" height="1" fill="#e0e0e0"/>
  <text x="36"  y="428" font-size="11" fill="#5f6368" font-weight="600">Queries</text>
  <text x="600" y="428" font-size="11" fill="#5f6368" font-weight="600">Clicks</text>
  <text x="680" y="428" font-size="11" fill="#5f6368" font-weight="600">Impressions</text>
  <text x="780" y="428" font-size="11" fill="#5f6368" font-weight="600">CTR</text>
  <text x="840" y="428" font-size="11" fill="#5f6368" font-weight="600">Position</text>

  <!-- Table rows -->
  <text x="36" y="455"  font-size="11" fill="#1a73e8">seo specialist pakistan</text>
  <text x="600" y="455" font-size="11" fill="#3c4043">3,241</text>
  <text x="680" y="455" font-size="11" fill="#3c4043">54,200</text>
  <text x="780" y="455" font-size="11" fill="#3c4043">5.97%</text>
  <text x="840" y="455" font-size="11" fill="#3c4043">4.1</text>

  <line x1="30" y1="462" x2="870" y2="462" stroke="#f1f3f4" stroke-width="1"/>

  <text x="36" y="477"  font-size="11" fill="#1a73e8">on page seo services</text>
  <text x="600" y="477" font-size="11" fill="#3c4043">2,887</text>
  <text x="680" y="477" font-size="11" fill="#3c4043">41,600</text>
  <text x="780" y="477" font-size="11" fill="#3c4043">6.94%</text>
  <text x="840" y="477" font-size="11" fill="#3c4043">5.3</text>

  <line x1="30" y1="484" x2="870" y2="484" stroke="#f1f3f4" stroke-width="1"/>

  <text x="36" y="499"  font-size="11" fill="#1a73e8">local seo consultant</text>
  <text x="600" y="499" font-size="11" fill="#3c4043">1,654</text>
  <text x="680" y="499" font-size="11" fill="#3c4043">28,300</text>
  <text x="780" y="499" font-size="11" fill="#3c4043">5.84%</text>
  <text x="840" y="499" font-size="11" fill="#3c4043">7.8</text>

</svg>
