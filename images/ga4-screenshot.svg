  <line x1="88" y1="245" x2="594" y2="245" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="88" y1="265" x2="594" y2="265" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="88" y1="285" x2="594" y2="285" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="88" y1="305" x2="594" y2="305" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="88" y1="325" x2="594" y2="325" stroke="#f1f3f4" stroke-width="1"/>
  <line x1="88" y1="380" x2="594" y2="380" stroke="#e0e0e0" stroke-width="1"/>

