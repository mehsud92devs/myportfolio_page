  <text x="810" y="242" font-size="10" fill="#5f6368" font-weight="600" text-anchor="end">Sessions</text>
  <rect x="622" y="247" width="260" height="1" fill="#e0e0e0"/>

  <!-- Channel rows -->
  <!-- Organic Search -->
