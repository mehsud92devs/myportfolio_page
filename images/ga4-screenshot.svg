<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="Google Sans, Roboto, Arial, sans-serif">

  <!-- Page background -->
  <rect width="900" height="520" fill="#f8f9fa"/>

  <!-- Left sidebar -->
  <rect width="56" height="520" fill="#1a1a2e"/>
  <!-- Sidebar icons (simplified) -->
  <rect x="16" y="16" width="24" height="24" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="28" y="33" font-size="13" fill="#e8eaed" text-anchor="middle">G</text>
  <rect x="14" y="64" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.3)"/>
  <rect x="14" y="72" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="14" y="100" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="14" y="108" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="14" y="136" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
  <rect x="14" y="144" width="20" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>

  <!-- Main content area -->
  <rect x="56" width="844" height="520" fill="#f8f9fa"/>

  <!-- Top bar -->
  <rect x="56" y="0" width="844" height="48" fill="#ffffff"/>
  <rect x="56" y="47" width="844" height="1" fill="#e0e0e0"/>

  <!-- GA4 branding -->
  <text x="72" y="30" font-size="16" font-weight="500" fill="#e37400">Analytics</text>
  <rect x="146" y="14" width="1" height="18" fill="#dadce0"/>
  <text x="156" y="30" font-size="13" fill="#5f6368">Abdul Majeed SEO</text>
  <text x="340" y="30" font-size="13" fill="#5f6368">Traffic acquisition</text>

  <!-- Date range chip -->
  <rect x="680" y="13" width="200" height="24" rx="12" fill="#e8f0fe"/>
  <text x="720" y="29" font-size="11" fill="#1a73e8" font-weight="500">Jan 1 – Jun 30, 2024</text>
  <text x="692" y="29" font-size="11" fill="#1a73e8">&#128197;</text>

  <!-- Page title -->
  <text x="72" y="76" font-size="18" font-weight="500" fill="#202124">Traffic acquisition</text>
  <text x="72" y="94" font-size="12" fill="#5f6368">How users arrived at your site</text>

  <!-- METRIC CARDS -->
  <!-- Users -->
  <rect x="72" y="108" width="180" height="78" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="86" y="128" font-size="11" fill="#5f6368">Users</text>
  <text x="86" y="158" font-size="24" font-weight="600" fill="#202124">18,420</text>
  <text x="86" y="175" font-size="11" fill="#34a853">&#9650; 189%</text>
  <text x="108" y="175" font-size="11" fill="#5f6368">vs prev. period</text>

  <!-- Sessions -->
  <rect x="262" y="108" width="180" height="78" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="276" y="128" font-size="11" fill="#5f6368">Sessions</text>
  <text x="276" y="158" font-size="24" font-weight="600" fill="#202124">24,850</text>
  <text x="276" y="175" font-size="11" fill="#34a853">&#9650; 207%</text>
  <text x="298" y="175" font-size="11" fill="#5f6368">vs prev. period</text>

  <!-- Engaged sessions -->
  <rect x="452" y="108" width="180" height="78" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="466" y="128" font-size="11" fill="#5f6368">Engaged sessions</text>
  <text x="466" y="158" font-size="24" font-weight="600" fill="#202124">16,940</text>
  <text x="466" y="175" font-size="11" fill="#34a853">&#9650; 231%</text>
  <text x="488" y="175" font-size="11" fill="#5f6368">vs prev. period</text>

  <!-- Engagement rate -->
  <rect x="642" y="108" width="180" height="78" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="656" y="128" font-size="11" fill="#5f6368">Engagement rate</text>
  <text x="656" y="158" font-size="24" font-weight="600" fill="#202124">68.2%</text>
  <text x="656" y="175" font-size="11" fill="#34a853">&#9650; 8.4%</text>
  <text x="678" y="175" font-size="11" fill="#5f6368">vs prev. period</text>

  <!-- LINE CHART PANEL -->
  <rect x="72" y="198" width="540" height="200" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="88" y="220" font-size="12" font-weight="500" fill="#202124">Sessions over time</text>

  <!-- Chart legend -->
  <rect x="88" y="228" width="10" height="3" rx="1.5" fill="#1a73e8"/>
  <text x="102" y="233" font-size="10" fill="#5f6368">Organic Search</text>
  <rect x="178" y="228" width="10" height="3" rx="1.5" fill="#fbbc04"/>
  <text x="192" y="233" font-size="10" fill="#5f6368">Direct</text>

