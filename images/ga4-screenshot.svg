  <text x="83" y="248" font-size="9" fill="#80868b" text-anchor="end">5K</text>
  <text x="83" y="288" font-size="9" fill="#80868b" text-anchor="end">3K</text>
  <text x="83" y="328" font-size="9" fill="#80868b" text-anchor="end">1K</text>

  <!-- X-axis labels -->
  <text x="100" y="393" font-size="9" fill="#80868b" text-anchor="middle">Jan</text>
  <text x="200" y="393" font-size="9" fill="#80868b" text-anchor="middle">Feb</text>
  <text x="300" y="393" font-size="9" fill="#80868b" text-anchor="middle">Mar</text>
  <text x="400" y="393" font-size="9" fill="#80868b" text-anchor="middle">Apr</text>
  <text x="490" y="393" font-size="9" fill="#80868b" text-anchor="middle">May</text>
  <text x="574" y="393" font-size="9" fill="#80868b" text-anchor="middle">Jun</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="organicGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a73e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a73e8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="directGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbc04" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbc04" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropshadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00000014"/>
    </filter>
  </defs>

  <!-- Direct traffic area + line (lower) -->
  <path d="M92,368 L192,362 L292,355 L392,348 L482,340 L566,334 L566,380 L92,380 Z" fill="url(#directGrad)"/>
  <polyline points="92,368 192,362 292,355 392,348 482,340 566,334"
            fill="none" stroke="#fbbc04" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Organic search area + line (dominant, growing) -->
  <path d="M92,372 L192,365 L292,352 L392,330 L482,298 L566,258 L566,380 L92,380 Z" fill="url(#organicGrad)"/>
  <polyline points="92,372 192,365 292,352 392,330 482,298 566,258"
            fill="none" stroke="#1a73e8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Data point at end -->
  <circle cx="566" cy="258" r="4" fill="#1a73e8" stroke="#fff" stroke-width="2"/>

  <!-- Tooltip -->
  <rect x="490" y="232" width="110" height="50" rx="4" fill="#fff" stroke="#dadce0" stroke-width="1" filter="url(#dropshadow)"/>
  <text x="498" y="248" font-size="10" fill="#5f6368">Jun 30, 2024</text>
  <rect x="498" y="253" width="8" height="2" rx="1" fill="#1a73e8"/>
  <text x="510" y="256" font-size="10" fill="#1a73e8">Organic: <tspan font-weight="600">4,820</tspan></text>
  <rect x="498" y="263" width="8" height="2" rx="1" fill="#fbbc04"/>
  <text x="510" y="267" font-size="10" fill="#80868b">Direct: <tspan font-weight="600">640</tspan></text>

