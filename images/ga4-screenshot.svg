  <text x="650" y="263" font-size="11" fill="#202124">Organic Search</text>
  <text x="874" y="263" font-size="11" fill="#202124" text-anchor="end">14,220</text>
  <!-- Bar -->
  <rect x="636" y="267" width="218" height="4" rx="2" fill="#f1f3f4"/>
  <rect x="636" y="267" width="160" height="4" rx="2" fill="#1a73e8" opacity="0.7"/>
  <rect x="622" y="278" width="260" height="1" fill="#f1f3f4"/>

  <!-- Direct -->
  <rect x="636" y="285" width="8" height="8" rx="2" fill="#fbbc04"/>
  <text x="650" y="294" font-size="11" fill="#202124">Direct</text>
  <text x="874" y="294" font-size="11" fill="#202124" text-anchor="end">4,890</text>
  <rect x="636" y="298" width="218" height="4" rx="2" fill="#f1f3f4"/>
  <rect x="636" y="298" width="55" height="4" rx="2" fill="#fbbc04" opacity="0.7"/>
  <rect x="622" y="309" width="260" height="1" fill="#f1f3f4"/>

  <!-- Referral -->
  <rect x="636" y="316" width="8" height="8" rx="2" fill="#34a853"/>
  <text x="650" y="325" font-size="11" fill="#202124">Referral</text>
  <text x="874" y="325" font-size="11" fill="#202124" text-anchor="end">2,940</text>
  <rect x="636" y="329" width="218" height="4" rx="2" fill="#f1f3f4"/>
  <rect x="636" y="329" width="33" height="4" rx="2" fill="#34a853" opacity="0.7"/>
  <rect x="622" y="340" width="260" height="1" fill="#f1f3f4"/>

  <!-- Social -->
  <rect x="636" y="347" width="8" height="8" rx="2" fill="#ea4335"/>
  <text x="650" y="356" font-size="11" fill="#202124">Organic Social</text>
  <text x="874" y="356" font-size="11" fill="#202124" text-anchor="end">1,680</text>
  <rect x="636" y="360" width="218" height="4" rx="2" fill="#f1f3f4"/>
  <rect x="636" y="360" width="19" height="4" rx="2" fill="#ea4335" opacity="0.7"/>
  <rect x="622" y="371" width="260" height="1" fill="#f1f3f4"/>

  <!-- Email -->
  <rect x="636" y="378" width="8" height="8" rx="2" fill="#a142f4"/>
  <text x="650" y="387" font-size="11" fill="#202124">Email</text>
  <text x="874" y="387" font-size="11" fill="#202124" text-anchor="end">1,120</text>

  <!-- BOTTOM ROW: Comparison + Landing pages -->
  <rect x="72" y="410" width="358" height="100" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="88" y="430" font-size="12" font-weight="500" fill="#202124">Organic sessions vs. previous period</text>

  <!-- Comparison mini chart -->
  <text x="88" y="450" font-size="10" fill="#5f6368">Jan–Jun 2023</text>
  <rect x="88" y="454" width="160" height="6" rx="3" fill="#e0e0e0"/>
  <rect x="88" y="454" width="50" height="6" rx="3" fill="#80868b"/>
  <text x="254" y="462" font-size="11" fill="#80868b">4,820</text>

  <text x="88" y="475" font-size="10" fill="#1a73e8" font-weight="500">Jan–Jun 2024</text>
  <rect x="88" y="479" width="160" height="6" rx="3" fill="#e8f0fe"/>
  <rect x="88" y="479" width="160" height="6" rx="3" fill="#1a73e8" opacity="0.8"/>
  <text x="254" y="487" font-size="11" fill="#1a73e8" font-weight="600">14,220</text>

  <text x="88" y="504" font-size="10" fill="#34a853">&#9650; +195% increase in organic sessions</text>

  <!-- Landing pages panel -->
  <rect x="440" y="410" width="442" height="100" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  <text x="456" y="430" font-size="12" font-weight="500" fill="#202124">Top landing pages (Organic)</text>
  <rect x="440" y="437" width="442" height="1" fill="#e0e0e0"/>

  <text x="456" y="452" font-size="11" fill="#1a73e8">/</text>
  <text x="720" y="452" font-size="11" fill="#202124" text-anchor="end">3,210 sessions</text>
  <rect x="440" y="457" width="442" height="1" fill="#f1f3f4"/>

  <text x="456" y="472" font-size="11" fill="#1a73e8">/seo-services</text>
  <text x="720" y="472" font-size="11" fill="#202124" text-anchor="end">2,480 sessions</text>
  <rect x="440" y="477" width="442" height="1" fill="#f1f3f4"/>

  <text x="456" y="492" font-size="11" fill="#1a73e8">/local-seo</text>
  <text x="720" y="492" font-size="11" fill="#202124" text-anchor="end">1,640 sessions</text>
  <rect x="440" y="497" width="442" height="1" fill="#f1f3f4"/>

  <text x="456" y="512" font-size="11" fill="#1a73e8">/contact</text>
  <text x="720" y="512" font-size="11" fill="#202124" text-anchor="end">1,220 sessions</text>

</svg>
